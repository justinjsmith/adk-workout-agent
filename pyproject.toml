[project]
name = "adk-workout-agent"
version = "0.1.0"
description = "Google ADK agent that parses swim workout emails into structured format"
requires-python = ">=3.12"
dependencies = [
    "google-adk[extensions,litellm]>=0.3.0",
    "anthropic>=0.52.0",
    "litellm>=1.75.5",
    "google-cloud-firestore>=2.16.0",
    "google-auth>=2.29.0",
    "google-api-python-client>=2.127.0",
    "flask>=3.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "google-auth-oauthlib>=1.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
